<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robottino</title>
<style>
:root{--bg:#e9eef4;--fg:#18212d;--muted:#5a6676;--card:#fff;--line:#c9d2de;--accent:#0b8fb3;--accent-fg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e8edf4;--muted:#93a0b2;--card:#151b24;--line:#2a3340;--accent:#5fe3ff;--accent-fg:#06222b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e8edf4;--muted:#93a0b2;--card:#151b24;--line:#2a3340;--accent:#5fe3ff;--accent-fg:#06222b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 18%,rgba(95,227,255,.10),transparent 48%),var(--bg);color:var(--fg);font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding: max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));overflow-x:hidden}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:0}
/* Il personaggio occupa la schermata: testa e corpo sono disegnati separatamente ma allineati */
.robot-stage{position:relative;width:100%;height:min(68svh,540px);min-height:410px;isolation:isolate;margin:0 auto;touch-action:manipulation;user-select:none}
.body-slot{position:absolute;inset:40px 0 0 0;width:100%;height:auto;z-index:1;pointer-events:none}
.robot-body-svg{width:100%;height:100%;display:block;overflow:visible}
.screen-wrap{position:absolute;top:30px;left:50%;transform:translateX(-50%) perspective(800px);transform-style:preserve-3d;z-index:5;width:56%;max-width:236px;padding:0;background:transparent;animation:headIdle 11s ease-in-out infinite}
/* guscio posteriore: dà profondità alla testa */
.screen-wrap::before{content:"";position:absolute;inset:-7px -7px -12px;border-radius:52px;background:linear-gradient(150deg,#e6edf3,#93a6b6 55%,#5d7080);transform:translateZ(-16px);z-index:-1;box-shadow:0 16px 28px rgba(0,0,0,.26);pointer-events:none}
/* cuffie metallizzate sopra lo schermo, sul movimento della testa */
.headphones{position:absolute;left:-14%;top:-18%;width:128%;height:136%;z-index:3;pointer-events:none;overflow:visible}
/* riflesso lucido sullo schermo */
.screen::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%);pointer-events:none;z-index:2}
.screen{background:#070b12;border-radius:44px;border:6px solid transparent;background-clip:padding-box;outline:2px solid rgba(176,198,216,.75);box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 0 0 2px rgba(95,227,255,.16);aspect-ratio:4/3;width:100%;max-height:29svh;overflow:hidden;position:relative;touch-action:manipulation;user-select:none}
.screen svg{width:100%;height:100%;display:block}
.say{position:relative;z-index:6;width:min(94%,410px);min-height:2.6em;text-align:center;font-size:1rem;line-height:1.35;padding:11px 14px;margin:-2px auto 8px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 5px 16px rgba(0,0,0,.08)}
.menu-toggle{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;border:1px solid #91a5b7;background:linear-gradient(145deg,#eef3f7,#aebdca);color:#1c2b39;box-shadow:0 4px 12px rgba(0,0,0,.16);font-size:1.25rem;font-weight:800}
.menu-toggle svg{width:21px;height:21px}
.command-panel{width:100%;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.08);margin-bottom:12px}
.command-panel[hidden]{display:none!important}
.controls{display:flex;flex-direction:column;gap:8px}
.mode-btn{font-size:.9rem;padding:9px 12px}
button{font:inherit;cursor:pointer}
#talk{background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:18px;font-size:1.25rem;font-weight:800}
#talk:active{transform:scale(.98)}
#talk[aria-pressed="true"]{outline:4px solid var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=password]{flex:1;min-width:0;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.row button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
label{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--muted)}
label input[type=range]{flex:1}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:700}
details .row,details label{margin-top:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode-btn{font-size:.95rem;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.mode-btn.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.face-hint{display:none}.mode-select{display:none!important}#catFace{display:none!important}

/* Animazioni coordinate del corpo */
.robot-body-svg .metal{fill:url(#metalGrad);stroke:#3e4e5b;stroke-width:2.6;stroke-linejoin:round}
.robot-body-svg .dark-metal{fill:url(#darkMetalGrad);stroke:#16202a;stroke-width:2.6;stroke-linejoin:round}
.robot-body-svg .blue-part{fill:url(#blueGrad);stroke:#7fe6ff;stroke-width:1.5}
.robot-body-svg .joint{fill:url(#darkMetalGrad);stroke:#2a3844;stroke-width:2.5}
.robot-body-svg .glow{filter:url(#blueGlow)}
.robot-body-svg .robot-torso{transform-box:fill-box;transform-origin:center 45%;animation:torsoFloat 3.8s ease-in-out infinite}
.robot-body-svg #leftArm{transform-box:view-box;transform-origin:122px 222px;animation:armRestL 4.6s ease-in-out infinite}
.robot-body-svg #rightArm{transform-box:view-box;transform-origin:278px 222px;animation:armRestR 4.2s ease-in-out infinite}
.robot-body-svg #leftLeg{transform-box:view-box;transform-origin:165px 365px;animation:legRestL 4.8s ease-in-out infinite}
.robot-body-svg #rightLeg{transform-box:view-box;transform-origin:235px 365px;animation:legRestR 4.8s ease-in-out infinite}
.robot-shadow{transform-origin:center;animation:shadowPulse 3.8s ease-in-out infinite}
@keyframes torsoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes armRestL{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
@keyframes armRestR{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
@keyframes legRestL{0%,100%{transform:rotate(0)}50%{transform:rotate(1deg)}}
@keyframes legRestR{0%,100%{transform:rotate(0)}50%{transform:rotate(-1deg)}}
@keyframes shadowPulse{0%,100%{opacity:.28;transform:scaleX(1)}50%{opacity:.20;transform:scaleX(.88)}}
@keyframes headIdle{0%,58%,100%{transform:translateX(-50%) perspective(800px) rotateX(0) rotateY(0) translateY(0)}64%{transform:translateX(-50%) perspective(800px) rotateX(-4deg) rotateY(-9deg) translateY(-2px)}70%{transform:translateX(-50%) perspective(800px) rotateX(2deg) rotateY(7deg) translateY(0)}76%{transform:translateX(-50%) perspective(800px) rotateX(-1deg) rotateY(-3deg) translateY(0)}82%{transform:translateX(-50%) perspective(800px) rotateX(0) rotateY(0) translateY(0)}}
@keyframes robotWave{0%,100%{transform:rotate(0)}25%{transform:rotate(-22deg)}55%{transform:rotate(15deg)}80%{transform:rotate(-12deg)}}
@keyframes robotBounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-13px)}65%{transform:translateY(1px)}}
@keyframes robotStepL{0%,100%{transform:rotate(0)}35%{transform:rotate(-13deg)}70%{transform:rotate(5deg)}}
@keyframes robotStepR{0%,100%{transform:rotate(0)}35%{transform:rotate(13deg)}70%{transform:rotate(-5deg)}}
@keyframes robotHeadTilt{0%,100%{transform:rotate(0)}40%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}}
#robotStage[data-gesture="wave"] #rightArm{animation:robotWave .9s ease-in-out 2}
#robotStage[data-gesture="bounce"] .robot-torso{animation:robotBounce .7s ease-in-out 2}
#robotStage[data-gesture="walk"] #leftLeg{animation:robotStepL .55s ease-in-out 3}
#robotStage[data-gesture="walk"] #rightLeg{animation:robotStepR .55s ease-in-out 3}
#robotStage[data-gesture="walk"] #leftArm{animation:robotStepR .55s ease-in-out 3}
#robotStage[data-gesture="walk"] #rightArm{animation:robotStepL .55s ease-in-out 3}
#robotStage[data-gesture="open"] #leftArm{animation:robotWave .8s ease-in-out 2}
#robotStage[data-gesture="open"] #rightArm{animation:robotWave .8s ease-in-out 2 reverse}
#robotStage[data-mood="happy"] #leftArm,#robotStage[data-mood="enthusiastic"] #leftArm{animation:armRestL 1.1s ease-in-out infinite}
#robotStage[data-mood="happy"] #rightArm,#robotStage[data-mood="enthusiastic"] #rightArm{animation:armRestR 1.1s ease-in-out infinite}
#robotStage[data-mood="curious"] .screen,#robotStage[data-mood="think"] .screen{animation:robotHeadTilt 2s ease-in-out}
#robotStage.is-speaking .robot-torso{animation:torsoFloat 1.1s ease-in-out infinite}
#robotStage.is-speaking #leftArm{animation:armRestL 1.4s ease-in-out infinite}
#robotStage.is-speaking #rightArm{animation:armRestR 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.robot-body-svg *,#robotStage .screen,.screen-wrap,.robot-shadow{animation:none!important;transition:none!important}}

#leftArm .metal,#rightArm .metal{fill:url(#softMetalGrad);stroke:#4d5e6c;stroke-width:2.2}
#leftArm .dark-metal,#rightArm .dark-metal{fill:url(#wristGrad);stroke:#22303b;stroke-width:2}
#leftArm .joint,#rightArm .joint{fill:url(#wristGrad);stroke:#22303b;stroke-width:2}
</style>
</head>
<body>
<main>
<div class="robot-stage" id="robotStage" data-mood="idle" aria-label="Robottino animato">
<div class="body-slot" id="bodySlot" aria-hidden="true">

  <path class="metal" d="M106.6 217.5 L105.6 222.0 L104.6 226.6 L103.6 231.1 L102.6 235.6 L101.6 240.1 L100.6 244.6 L99.6 249.1 L98.5 253.6 L97.5 258.1 L96.5 262.6 L95.5 267.1 L94.5 271.6 L93.5 276.1 L92.4 280.9 L91.8 284.3 L91.3 287.3 L90.8 290.4 L90.3 293.4 L89.8 296.5 L89.3 299.5 L88.8 302.6 L88.3 305.6 L87.8 308.7 L87.3 311.7 L86.8 314.8 L86.3 317.8 L85.8 320.9 L85.2 323.9 L102.8 328.1 L103.7 325.1 L104.6 322.2 L105.5 319.2 L106.4 316.3 L107.4 313.3 L108.3 310.4 L109.2 307.4 L110.1 304.5 L111.1 301.5 L112.0 298.6 L112.9 295.6 L113.8 292.7 L114.8 289.7 L115.6 287.1 L117.1 283.0 L118.6 278.6 L120.2 274.3 L121.8 270.0 L123.3 265.6 L124.9 261.3 L126.4 256.9 L128.0 252.6 L129.6 248.2 L131.1 243.9 L132.7 239.5 L134.2 235.2 L135.8 230.8 L137.4 226.5Z"/>

      <rect class="dark-metal" x="-19" y="-8" width="38" height="24" rx="9"/>

</g>
<g id="rightArm">
  <g transform="matrix(-1 0 0 1 400 0)">

      <circle class="blue-part" cx="0" cy="3" r="4"/>
      <rect class="metal" x="-21" y="14" width="42" height="20" rx="7"/>
      <rect x="-20" y="31" width="40" height="3.5" rx="1.75" fill="#27343f"/>

<!-- Collo e busto -->

</div>
<div class="screen-wrap">
<div class="screen" id="faceArea" aria-label="Volto del robottino – doppio tocco per cambiare modalità">
<svg viewBox="0 0 400 300" role="img" aria-label="Faccia del robot">
<defs>
  <clipPath id="cl"><rect id="clr" x="70" y="60" width="80" height="90" rx="28"/></clipPath>
  <clipPath id="cr"><rect id="crr" x="250" y="60" width="80" height="90" rx="28"/></clipPath>
</defs>

<!-- ========== ROBOT FACE ========== -->
</g>
<g id="robotFace" style="opacity:1;transition:opacity .45s ease">
  <g>
    <rect id="rl" x="70" y="60" width="80" height="90" rx="28" fill="#5fe3ff"/>
    <g clip-path="url(#cl)">
      <circle id="chl" cx="110" cy="200" r="70" fill="#070b12"/>
      <polygon id="lidl" points="0,0 0,0 0,0" fill="#070b12"/>
    </g>
  </g>
  <g>
    <rect id="rr" x="250" y="60" width="80" height="90" rx="28" fill="#5fe3ff"/>
    <g clip-path="url(#cr)">
      <circle id="chr" cx="290" cy="200" r="70" fill="#070b12"/>
      <polygon id="lidr" points="0,0 0,0 0,0" fill="#070b12"/>
    </g>
  </g>
  <path id="mouth" d="" fill="#5fe3ff" stroke="#5fe3ff" stroke-width="7" stroke-linejoin="round"/>
</g>

<!-- ========== CAT FACE (robot style migliorato) ========== -->
<g id="catFace" style="opacity:0;transition:opacity .45s ease;pointer-events:none">
  <!-- Orecchie agli spigoli in alto -->
  <g id="catEars">
    <!-- Sinistra - angolo alto sinistro -->
    <path d="M55 55 L18 5 L95 40 Z" fill="#5fe3ff"/>
    <path d="M60 48 L35 15 L88 38 Z" fill="#070b12"/>
    <!-- Destra - angolo alto destro -->
    <path d="M345 55 L382 5 L305 40 Z" fill="#5fe3ff"/>
    <path d="M340 48 L365 15 L312 38 Z" fill="#070b12"/>
  </g>

  <!-- Occhi (stesso linguaggio del robot, leggermente più in basso per lasciare spazio alle orecchie) -->
  <g>
    <rect id="catRl" x="72" y="78" width="78" height="86" rx="26" fill="#5fe3ff"/>
    <g clip-path="url(#cl)">
      <circle id="catChl" cx="111" cy="200" r="68" fill="#070b12"/>
      <polygon id="catLidl" points="0,0 0,0 0,0" fill="#070b12"/>
    </g>
  </g>
  <g>
    <rect id="catRr" x="250" y="78" width="78" height="86" rx="26" fill="#5fe3ff"/>
    <g clip-path="url(#cr)">
      <circle id="catChr" cx="289" cy="200" r="68" fill="#070b12"/>

<script>
const $=id=>document.getElementById(id);
const sayEl=$('say'),talk=$('talk');
const store={get(k){try{return localStorage.getItem(k)||'';}catch(_){return '';}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}}};
const robotStage = $('robotStage');
const commandPanel = $('commandPanel');
const menuToggle = $('menuToggle');
function openCommandPanel(){
  commandPanel.hidden = false;
  menuToggle.setAttribute('aria-expanded','true');
  menuToggle.setAttribute('aria-label','Chiudi i comandi');
}
function closeCommandPanel(){
  commandPanel.hidden = true;
  menuToggle.setAttribute('aria-expanded','false');
  menuToggle.setAttribute('aria-label','Apri i comandi');
}
menuToggle.addEventListener('click',()=>{
  if(commandPanel.hidden) openCommandPanel(); else closeCommandPanel();
});
let hasInteracted = false;
document.addEventListener('pointerdown',()=>{hasInteracted=true;},{once:true});
/* Fornitori IA: ogni fornitore ha la sua chiave e il suo modello */
const PROVIDERS = {
  gemini:{label:'Gemini', keyStore:'gk', modelStore:'gm', defaultModel:'gemini-3.5-flash-lite', placeholder:'Chiave API di Gemini'},
  openai:{label:'ChatGPT', keyStore:'ok', modelStore:'om', defaultModel:'gpt-4o-mini', placeholder:'Chiave API di OpenAI'}
};
function currentProvider(){ return store.get('provider') === 'openai' ? 'openai' : 'gemini'; }
function currentKey(){ return store.get(PROVIDERS[currentProvider()].keyStore); }
function currentModelName(){
  const p = PROVIDERS[currentProvider()];
  const saved = store.get(p.modelStore);
  // il vecchio modello salvato va sostituito con quello attuale
  if(!saved || saved === 'gemini-2.5-flash') return p.defaultModel;
  return saved;
}
function loadProviderUI(){
  const p = PROVIDERS[currentProvider()];
  $('provider').value = currentProvider();
  $('key').value = store.get(p.keyStore);
  $('key').placeholder = p.placeholder;
  $('model').value = currentModelName();
}
loadProviderUI();

$('savekey').addEventListener('click',()=>{ const p=PROVIDERS[currentProvider()]; store.set(p.keyStore,$('key').value.trim()); store.set(p.modelStore,$('model').value.trim()); $('set').open=false; sayEl.textContent='Salvato!'; });
$('provider').addEventListener('change',()=>{ store.set('provider',$('provider').value); loadProviderUI(); sayEl.textContent='Ora uso ' + PROVIDERS[currentProvider()].label + '.'; });
if(!currentKey()){openCommandPanel();$('set').open=true;}

let mode = 'robot'; // modalità gatto rinviata: in questa fase resta attivo il robottino
store.set('faceMode', 'robot');
const robotFace = $('robotFace');
const catFace = $('catFace');
const btnRobot = $('btnRobot');
const btnCat = $('btnCat');

function applyMode(m, animate=true){
  mode = m;
  store.set('faceMode', mode);
  if(animate){
    if(mode==='cat'){
      robotFace.style.opacity = '0';
      catFace.style.opacity = '1';
      catFace.style.pointerEvents = 'auto';
    }else{
      catFace.style.opacity = '0';
      robotFace.style.opacity = '1';
      catFace.style.pointerEvents = 'none';
    }
  }else{
    robotFace.style.opacity = mode==='robot' ? '1' : '0';
    catFace.style.opacity = mode==='cat' ? '1' : '0';
    catFace.style.pointerEvents = mode==='cat' ? 'auto' : 'none';
  }
  btnRobot.classList.toggle('active', mode==='robot');
  btnCat.classList.toggle('active', mode==='cat');
  $('faceHint').textContent = 'Accarezzami per interagire';
}
applyMode(mode, false);

btnRobot.addEventListener('click', ()=>applyMode('robot'));
btnCat.addEventListener('click', ()=>applyMode('cat'));

/* ---------- FASE 3: Personalità ---------- */
const PERSONALITIES = {
  playful: {
    id: 'playful',
    name: 'Giocherellone',
    label: 'Giocherellone',
    // influenza espressioni di base
    defaultMood: 'enthusiastic',
    petReaction: 'laugh',
    complimentReaction: 'enthusiastic',
    // frasi tipiche
    greetings: ['Ehi ciao! Giochiamo?', 'Yuhuu! Sono di umore birichino!', 'Ciao ciao! Pronto a divertirti?'],
    petPhrases: ['Ahahah! Ancora!','Ihihih che solletico buono!','Wiiiii! Mi fai ridere!'],
    complimentPhrases: ['Yuppiii! Grazie!','Sono il più bello vero? Ahah!','Che bello! Facciamo festa!'],
    annoyPhrases: ['Ehi non esagerare con i tocchi!','Hey! Sono giocherellone ma non troppo!','Basta così, birbante!'],
    idleHints: ['Che facciamo di bello?','Vuoi che ti racconti una barzelletta?','Giochiamo a qualcosa?']
  },
  cuddly: {
    id: 'cuddly',
    name: 'Coccolone',
    label: 'Coccolone',
    defaultMood: 'affection',
    petReaction: 'affection',
    complimentReaction: 'affection',
    greetings: ['Ciao… vieni a fare le coccole?','Ciao dolcezza…','Che bello vederti…'],
    petPhrases: ['Prrrrrr… che belle coccole…','Ancora un po’… mi piace tanto…','Mmm che tenerezza…'],
    complimentPhrases: ['Oh… grazie… mi fai arrossire…','Che carino da parte tua…','Prrrr… mi sento amato…'],
    annoyPhrases: ['Ehi… piano… sono sensibile…','Non essere troppo invadente…','Preferisco le coccole dolci…'],
    idleHints: ['Mi fai un po’ di compagnia?','Vuoi che ti stia vicino?','Le coccole mi rendono felice…']
  },
  curious: {
    id: 'curious',
    name: 'Curioso',
    label: 'Curioso',
    defaultMood: 'curious',
    petReaction: 'curious',
    complimentReaction: 'happy',
    greetings: ['Ciao! Cosa c’è di nuovo oggi?','Interessante… chi sei?','Ciao! Dimmi qualcosa di curioso!'],
    petPhrases: ['Oh… che sensazione interessante…','Mmm… perché mi tocchi così?','Curioso… mi piace questa cosa…'],
    complimentPhrases: ['Davvero? Interessante!','Grazie! Come hai deciso di dirmelo?','Oh! Non me l’aspettavo…'],
    annoyPhrases: ['Ehi, perché continui?','Sto cercando di capire cosa vuoi…','Un po’ troppi tocchi… che succede?'],
    idleHints: ['Ti va se ti faccio una domanda?','C’è qualcosa di nuovo da scoprire?','Dimmi pure, ascolto…']
  }
};

let personality = store.get('personality') || 'cuddly';
if(!PERSONALITIES[personality]) personality = 'cuddly';

const btnPlayful = $('btnPlayful');
const btnCuddly  = $('btnCuddly');
const btnCurious = $('btnCurious');

function applyPersonality(id, announce=true){
  if(!PERSONALITIES[id]) return;
  personality = id;
  store.set('personality', id);

  btnPlayful.classList.toggle('active', id==='playful');
  btnCuddly.classList.toggle('active',  id==='cuddly');
  btnCurious.classList.toggle('active', id==='curious');

  const p = PERSONALITIES[id];
  if(announce){
    const greet = p.greetings[Math.floor(Math.random()*p.greetings.length)];
    say(greet, p.defaultMood);
  }
}

btnPlayful.addEventListener('click', ()=>applyPersonality('playful'));
btnCuddly.addEventListener('click',  ()=>applyPersonality('cuddly'));
btnCurious.addEventListener('click', ()=>applyPersonality('curious'));

// Applica personalità salvata all’avvio (senza annunciare)
applyPersonality(personality, false);

/* ---------- FASE 5: Memoria locale ---------- */
const MEM_KEY = 'robottino_memories';
const NAME_KEY = 'robottino_name';

function loadMemories(){
  try{
    return JSON.parse(store.get(MEM_KEY) || '[]');
  }catch(_){ return []; }
}
function saveMemories(list){
  store.set(MEM_KEY, JSON.stringify(list));
  renderMemoryList();
}

/* ---------- FASE 6: Giochi ---------- */
let currentGame = null; // 'memory' | 'riddle' | null

const gameArea = $('gameArea');
const btnStopGame = $('btnStopGame');

function showGameUI(show){
  gameArea.style.display = show ? 'block' : 'none';
  btnStopGame.style.display = show ? 'block' : 'none';
  if(!show){
    gameArea.innerHTML = '';
    currentGame = null;
  }
}

btnStopGame.addEventListener('click', ()=>{
  showGameUI(false);
  mood = 'idle';
  say('Ok, abbiamo finito di giocare!', 'happy');
});

/* ===== GIOCO MEMORIA (coppie) ===== */
const MEM_SYMBOLS = ['⭐','🌙','☀️','🌸','🍀','🎵','🐶','🐱','🍎','🚀'];
let memCards = [];
let memFlipped = [];
let memMatched = 0;
let memMoves = 0;
let memLock = false;
let memLevel = 1; // 1=6 carte (3 coppie), 2=8, 3=12

function startMemoryGame(level){
  currentGame = 'memory';
  memLevel = level || 1;
  const pairs = memLevel === 1 ? 3 : (memLevel === 2 ? 4 : 6);
  const symbols = MEM_SYMBOLS.slice(0, pairs);
  memCards = [...symbols, ...symbols].sort(()=>Math.random()-0.5);
  memFlipped = [];
  memMatched = 0;
  memMoves = 0;
  memLock = false;

  renderMemoryBoard();
  showGameUI(true);
  openCommandPanel();
  $('gamesPanel').open = true;
  say(memLevel===1 ? 'Trova le coppie! Tocca le carte.' : `Livello ${memLevel}: trova le ${pairs} coppie!`, 'enthusiastic');
}

function renderMemoryBoard(){
  const cols = memCards.length <= 6 ? 3 : 4;
  gameArea.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:8px;max-width:320px;margin:0 auto">
      ${memCards.map((sym,i)=>`
        <button data-mem="${i}" class="mem-card" style="
          aspect-ratio:1;border-radius:14px;border:2px solid var(--line);
          background:var(--card);font-size:1.6rem;cursor:pointer;
          display:flex;align-items:center;justify-content:center;
          transition:transform .15s,background .15s">
          <span style="visibility:hidden">${sym}</span>
        </button>
      `).join('')}
    </div>
    <div style="text-align:center;margin-top:10px;font-size:.9rem;color:var(--muted)">
      Mosse: <span id="memMoves">0</span> · Coppie: <span id="memMatched">0</span>/${memCards.length/2}
    </div>`;

  gameArea.querySelectorAll('[data-mem]').forEach(btn=>{
    btn.addEventListener('click', ()=>flipMemCard(+btn.dataset.mem, btn));
  });
}

function flipMemCard(idx, btn){
  if(memLock || memFlipped.includes(idx) || btn.dataset.matched) return;
  // mostra
  btn.querySelector('span').style.visibility = 'visible';
  btn.style.background = 'var(--accent)';
  btn.style.color = 'var(--accent-fg)';
  memFlipped.push(idx);

  if(memFlipped.length === 2){
    memMoves++;
    $('memMoves').textContent = memMoves;
    memLock = true;
    const [a,b] = memFlipped;
    if(memCards[a] === memCards[b]){
      // coppia!
      memMatched++;
      $('memMatched').textContent = memMatched;
      gameArea.querySelector(`[data-mem="${a}"]`).dataset.matched = '1';
      gameArea.querySelector(`[data-mem="${b}"]`).dataset.matched = '1';
      memFlipped = [];
      memLock = false;
      playSound('happy');
      mood = 'happy';
      if(memMatched === memCards.length/2){
        setTimeout(()=>{
          say(`Bravissimo! Hai finito in ${memMoves} mosse!`, 'enthusiastic');
          spawnHearts(3);
          // proponi livello successivo
          setTimeout(()=>{
            if(memLevel < 3){
              sayEl.innerHTML += `<br><button id="nextMemLevel" style="margin-top:8px;padding:8px 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700">Livello successivo</button>`;
              $('nextMemLevel').onclick = ()=>startMemoryGame(memLevel+1);
            }
          }, 1200);
        }, 400);
      }else{
        const cheers = ['Bene!','Ottimo!','Continua così!','Yuppiii!'];
        sayEl.textContent = cheers[Math.floor(Math.random()*cheers.length)];
      }
    }else{
      // non uguali
      setTimeout(()=>{
        [a,b].forEach(i=>{
          const el = gameArea.querySelector(`[data-mem="${i}"]`);
          el.querySelector('span').style.visibility = 'hidden';
          el.style.background = 'var(--card)';
          el.style.color = '';
        });
        memFlipped = [];
        memLock = false;
        mood = 'curious';
      }, 700);
    }
  }
}

$('btnMemoryGame').addEventListener('click', ()=>startMemoryGame(1));

/* ===== INDOVINELLI ===== */
const RIDDLES = [
  {q:'Ha la testa tonda, non ha occhi ma vede il tempo. Cos’è?', a:['orologio','un orologio'], hint:'Lo guardi per sapere che ore sono.'},
  {q:'Più ne prendi, più ne lasci. Cosa sono?', a:['passi','i passi','impronte'], hint:'Li fai quando cammini.'},
  {q:'Sono alto quando sono giovane e basso quando sono vecchio. Chi sono?', a:['candela','una candela'], hint:'Mi consumo bruciando.'},
  {q:'Ha le chiavi ma non apre porte. Cos’è?', a:['pianoforte','un pianoforte','piano'], hint:'Si suona con le dita.'},
  {q:'Vola senza ali, piange senza occhi. Cos’è?', a:['nuvola','una nuvola','nube'], hint:'Sta nel cielo e porta la pioggia.'},
  {q:'Ha i denti ma non mangia. Cos’è?', a:['pettine','un pettine'], hint:'Lo usi per i capelli.'},
  {q:'Più sono caldi, più diventano freschi. Cosa sono?', a:['panini','i panini','il pane'], hint:'Appena sfornati sono caldi…'},
  {q:'Sono leggero come una piuma, ma il più forte non mi tiene per più di un minuto. Cos’è?', a:['respiro','il respiro','fiato'], hint:'Lo fai continuamente.'},
];

let riddleIdx = 0;
let riddleHintUsed = false;
let riddleList = [];

function startRiddleGame(){
  currentGame = 'riddle';
  riddleList = [...RIDDLES].sort(()=>Math.random()-0.5);
  riddleIdx = 0;
  riddleHintUsed = false;
  showRiddle();
  showGameUI(true);
  $('gamesPanel').open = true;
  say('Indovinello! Prova a indovinare.', 'curious');
}

function showRiddle(){
  if(riddleIdx >= riddleList.length){
    gameArea.innerHTML = '<p style="text-align:center">Hai finito tutti gli indovinelli! 🎉</p>';
    say('Bravissimo, li hai indovinati tutti!', 'enthusiastic');
    spawnHearts(3);
    return;
  }
  const r = riddleList[riddleIdx];
  riddleHintUsed = false;
  gameArea.innerHTML = `
    <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center">
      <div style="font-size:1.05rem;margin-bottom:12px">${r.q}</div>
      <div class="row">
        <input id="riddleAnswer" type="text" placeholder="La tua risposta…" style="flex:1">
        <button id="riddleGo">Prova</button>
      </div>
      <button id="riddleHint" style="margin-top:10px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.9rem">Suggerimento</button>
      <div id="riddleFeedback" style="margin-top:10px;min-height:1.3em"></div>
    </div>`;
  $('riddleGo').onclick = checkRiddleAnswer;
  $('riddleAnswer').onkeydown = e=>{ if(e.key==='Enter') checkRiddleAnswer(); };
  $('riddleHint').onclick = ()=>{
    if(!riddleHintUsed){
      riddleHintUsed = true;
      $('riddleFeedback').textContent = '💡 ' + r.hint;
      mood = 'curious';
    }
  };
}

function checkRiddleAnswer(){
  const ans = ($('riddleAnswer').value||'').trim().toLowerCase();
  if(!ans) return;
  const r = riddleList[riddleIdx];
  const ok = r.a.some(a => ans.includes(a) || a.includes(ans));
  if(ok){
    $('riddleFeedback').textContent = '✅ Esatto!';
    playSound('happy');
    mood = 'happy';
    say('Bravo! È corretto!', 'happy');
    riddleIdx++;
    setTimeout(showRiddle, 1200);

function startAmbient(){
  stopAmbient();
  if(!$('ambientSound').checked) return;
  try{
    const ctx = startAmbient.ctx || (startAmbient.ctx = new (window.AudioContext||window.webkitAudioContext)());
    // Rumore rosa / pioggia semplificata
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * 0.15;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;
    const gain = ctx.createGain();
    gain.gain.value = 0.12;
    noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    noise.start();
    ambientNode = {noise, gain, ctx};
  }catch(_){}
}
function stopAmbient(){
  if(ambientNode){
    try{ ambientNode.noise.stop(); }catch(_){}
    ambientNode = null;
  }
}

function storySay(text, moodName){
  text = (text||'').trim();
  if(!text) return Promise.resolve();
  return new Promise(resolve=>{
    sayEl.textContent = '“' + text + '”';
    if(!('speechSynthesis' in window)){ resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'it-IT';
    if(voices[0]) u.voice = voices[0];
    if(softVoiceOn){
      u.pitch = 1.15;
      u.rate = 0.82;          // più lento e dolce
    }else{
      u.pitch = parseFloat($('pitch').value) || 1.8;
      u.rate = 1.05;
    }
    u.onstart = ()=>{ speaking = true; mood = moodName || 'sleepy'; };
    u.onend = u.onerror = ()=>{ speaking = false; resolve(); };
    speechSynthesis.speak(u);
  });
}

async function generateStory(interactive){
  const key = currentKey();
  const minutes = chosenDuration;
  const botName = loadBotName();

  // Prompt per Gemini
  let prompt;
  if(interactive){
    prompt = `Inventa l'inizio di una dolce storia della buonanotte per bambini (in italiano), lunga circa 2-3 frasi. Includi un piccolo momento di scelta alla fine (es. "Vuoi che il protagonista vada nel bosco o verso il fiume?"). Tono calmo e rassicurante. Non usare tag emozionali.`;
  }else{
    prompt = `Inventa una dolce storia della buonanotte originale in italiano, adatta a bambini, tono calmo e rassicurante. Durata indicativa adatta a circa ${minutes} minuti se raccontata lentamente (circa ${minutes*90} parole). Inizia subito con la storia, senza titoli o premesse. Non usare tag emozionali.`;
  }
  prompt += ' ' + ageRules();

  if(!key || $('echo').checked){
    // Fallback storie locali
    const FALLBACK_STORIES = {
      '3-5': [
        `C'era una volta una piccola stella che ogni sera scendeva dal cielo per salutare i bambini. Gli sussurrava: buonanotte, dormi bene. E il bambino chiudeva gli occhi felice.`,
        `Un coniglietto soffice tornava a casa sotto la luna. Trovò il suo lettino morbido, si rannicchiò e sbadigliò piano. Buonanotte, coniglietto.`,
        `Nel prato c'erano tante lucciole che accendevano le lanterne. Una alla volta si spegnevano, e la notte diventava tutta calma e silenziosa. Dormi tranquillo.`
      ],
      '6-8': [
        `Una sera il gufo Tobia scoprì una lucciola smarrita nel bosco. Insieme seguirono la luce della luna fino al fiume, e la lucciola ritrovò la sua famiglia. Tobia tornò al nido stanco e contento, e si addormentò sotto le stelle.`,
        `Lia trovò una vecchia mappa nascosta in un libro. Indicava un giardino pieno di fiori che cantavano piano. Lia li ascoltò, poi tornò a casa con un sorriso, pronta per sognare il giorno dopo.`,
        `Il piccolo drago Pippo voleva volare fino alle nuvole. Provò e riprovò, e alla fine capì che poteva volare piano, un passo alla volta. Atterrò nel suo cesto di paglia e si addormentò soddisfatto.`
      ],
      '9-12': [
        `Marta scoprì che la biblioteca del paese aveva una porta segreta. Dietro c'era una stanza piena di mappe disegnate a mano, che portavano a isole mai viste. Decise di esplorarne una la settimana dopo, ma prima chiuse il libro e sorrise, pensando all'avventura che la aspettava.`,
        `Un gruppo di amici costruì una piccola barca di legno per cercare la stella più luminosa del cielo. Remarono nel lago fino a notte, e sopra di loro le stelle sembravano più vicine. Tornarono a casa stanchi, ma pieni di meraviglia.`,
        `Il robot Zeno aveva un compito: riparare il vecchio orologio della piazza. Mentre lavorava, un bambino gli chiese come facevano le lancette a sapere l'ora. Zeno spiegò tutto con pazienza, e il bambino tornò a casa con una nuova idea per il giorno dopo.`
      ]
    };
    const DEFAULT_STORIES = [
      `C'era una volta una piccola stella che ogni sera scendeva piano piano dal cielo per salutare i bambini. Si posava sul davanzale e raccontava storie di nubi soffici e lune sorridenti, finché le palpebre diventavano pesanti e il sonno arrivava dolce come una nuvola.`,
      `Nel bosco degli alberi che sussurrano, un piccolo gufo imparava a volare di notte. Guardava le lucciole danzare e ascoltava il vento che cantava una ninnananna. Quando tornava al nido, si sentiva al sicuro e chiudeva gli occhi.`,
      `Sul fondo del mare viveva una conchiglia che collezionava sogni. Ogni notte li portava in superficie e li lasciava galleggiare verso le case dei bambini, così che potessero sognare avventure serene e risvegliarsi felici.`
    ];
    // Scegli le storie in base alla fascia d'età impostata (se c'è)
    const pool = FALLBACK_STORIES[currentAge()] || DEFAULT_STORIES;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  try{
    const model = currentModelName();
    const r = await callAI(model, key, {
      contents:[{role:'user', parts:[{text:prompt}]}],
      generationConfig:{maxOutputTokens: minutes > 5 ? 1200 : 700}
    });
    if(!r.ok) throw new Error('api');
    const j = await r.json();
    let t = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('').trim();
    // rimuovi eventuali tag
    t = t.replace(/^\s*\[.*?\]\s*/,'').trim();
    return t || null;
  }catch(_){
    return null;
  }
}

async function runStory(interactive){
  if(storyRunning) return;
  storyRunning = true;
  storyPaused = false;
  $('btnStopStory').style.display = 'block';
  $('storyStatus').textContent = 'Sto preparando la storia…';
  $('bedtimePanel').open = true;
  mood = 'sleepy';
  startAmbient();

  const storyText = await generateStory(interactive);
  if(!storyText){
    $('storyStatus').textContent = 'Non sono riuscito a inventare la storia. Riprova.';
    storyRunning = false;
    stopAmbient();
    $('btnStopStory').style.display = 'none';
    return;
  }

  // Salva in biblioteca
  const stories = loadStories();
  stories.unshift({
    title: storyText.slice(0,40).replace(/\n/g,' ') + '…',
    text: storyText,
    date: new Date().toLocaleDateString('it-IT'),
    interactive
  });
  saveStories(stories);

  // Spezza in frasi per raccontare piano
  const sentences = storyText.replace(/\n+/g,'. ').split(/(?<=[.!?…])\s+/).filter(s=>s.trim().length>3);
  storyEndTime = Date.now() + chosenDuration * 60 * 1000;
  $('storyStatus').textContent = `Racconto in corso (${chosenDuration} min)…`;

  let i = 0;
  async function nextSentence(){
    if(!storyRunning || storyPaused) return;
    if(Date.now() > storyEndTime || i >= sentences.length){
      // fine
      await storySay('E ora è tempo di dormire. Sogni d\'oro.', 'sleepy');
      mood = 'sleepy';
      cur.lid = 0.85;
      $('storyStatus').textContent = 'Storia finita. Sogni d\'oro.';
      storyRunning = false;
      $('btnStopStory').style.display = 'none';
      setTimeout(stopAmbient, 4000);
      return;
    }
    // varia un po' l'espressione
    const moods = ['sleepy','affection','happy','curious','sleepy'];
    await storySay(sentences[i], moods[i % moods.length]);
    i++;
    // piccola pausa tra le frasi
    if(storyRunning && !storyPaused){
      setTimeout(nextSentence, softVoiceOn ? 600 : 350);
    }
  }
  nextSentence();
}

// Riconosce quando l'utente chiede di ricordare qualcosa
function checkMemoryCommand(text){
  const low = (text||'').toLowerCase();
  // "Ricordati che ..." / "Ricorda che ..."
  const m = low.match(/(?:ricorda(?:ti)?|tieni\s+a\s+mente|salva)\s+(?:che\s+)?(.+)/i);
  if(m && m[1]){
    proposeMemory(m[1].trim());
    return true;
  }
  // "Cosa ti ricordi?" / "Dimmi i tuoi ricordi"
  if(/cosa\s+ti\s+ricordi|dimmi\s+i\s+(tuoi\s+)?ricordi|mostra\s+i\s+ricordi|che\s+cosa\s+sai\s+di\s+me/.test(low)){
    const list = loadMemories();
    if(!list.length){
      say('Non ho ancora nessun ricordo salvato.', 'curious');
    }else{
      const preview = list.slice(0,5).map((x,i)=>`${i+1}. ${x.text}`).join(' ');
      say(`Mi ricordo queste cose: ${preview}${list.length>5?' … e altre ancora.':''}`, 'happy');
    }
    // apri il pannello
    openCommandPanel();
    $('memoryPanel').open = true;
    return true;
  }
  // "Cancella la memoria" / "Dimentica tutto"
  if(/cancella\s+(tutta\s+)?la\s+memoria|dimentica\s+tutto|svuota\s+i\s+ricordi/.test(low)){
    saveMemories([]);
    say('Ho cancellato tutta la memoria.', 'sad');
    return true;
  }
  return false;
}

function playSound(type){
  // Suoni leggeri con Web Audio (non bloccanti)
  try{
    const ctx = playSound.ctx || (playSound.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if(type==='purr'){
      o.type='sine'; o.frequency.value=45;
      g.gain.setValueAtTime(0.08,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
      o.start(); o.stop(ctx.currentTime+0.8);
    }else if(type==='happy'){
      o.type='triangle'; o.frequency.value=520;
      g.gain.setValueAtTime(0.07,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);
      o.start(); o.stop(ctx.currentTime+0.25);
    }else if(type==='laugh'){
      o.type='square'; o.frequency.value=380;
      g.gain.setValueAtTime(0.05,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);
      o.start(); o.stop(ctx.currentTime+0.18);
      setTimeout(()=>playSound('laugh2'),120);
    }else if(type==='laugh2'){
      o.type='square'; o.frequency.value=440;
      g.gain.setValueAtTime(0.04,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
      o.start(); o.stop(ctx.currentTime+0.15);
    }else if(type==='annoy'){
      o.type='sawtooth'; o.frequency.value=180;
      g.gain.setValueAtTime(0.06,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
      o.start(); o.stop(ctx.currentTime+0.3);
    }
  }catch(_){}
}

faceArea.addEventListener('pointerup', e=>{
  const now = Date.now();
  const duration = now - touchStartTime;
  const rect = faceArea.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  const dx = Math.abs(x - touchStartX);
  const dy = Math.abs(y - touchStartY);

  // Zona testa (parte alta)
  const isHead = y < 0.32;
  // Zona musetto / centro-basso
  const isMuzzle = y > 0.45 && y < 0.82 && x > 0.25 && x < 0.75;

  if(duration > 450 && isMuzzle && dy < 0.15){
    // Carezza lunga sul musetto
    doPet();
  }else if(duration < 280 && isHead){
    // Tocco rapido sulla testa
    doHeadPat();
  }else if(duration < 220 && dy > 0.08){
    // Movimento rapido = solletico
    doTickle();
  }else if(duration < 200 && isMuzzle){
    // Tocchi ripetuti sul musetto = possibile fastidio
    doAnnoy();
  }
});

// Swipe / drag per carezza
faceArea.addEventListener('pointermove', e=>{
  if(e.buttons !== 1) return;
  const rect = faceArea.getBoundingClientRect();
  const y = (e.clientY - rect.top) / rect.height;
  const x = (e.clientX - rect.left) / rect.width;
  if(y > 0.4 && y < 0.85 && x > 0.2 && x < 0.8){
    // Sta accarezzando
    if(!isPetting) doPet();
  }
});

/* Riconoscimento complimenti (testo e voce) */
const COMPLIMENTS = [
  /sei\s+(bellissim[oa]|carin[oa]|tener[oa]|simpatic[oa]|adorabile|dolce|meraviglios[oa])/i,
  /ti\s+voglio\s+bene/i,
  /bravo[oa]?[!]?/i,
  /che\s+(carino|bello|tenero|dolce)/i,
  /mi\s+piaci/i,
  /sei\s+il\s+migliore/i
];

function checkCompliment(text){
  const t = (text||'').trim();
  if(!t) return false;
  for(const re of COMPLIMENTS){
    if(re.test(t)) return true;
  }
  return false;
}


let mood='idle', speaking=false;
const cur={h:90, cheek:0, lid:0, o:0, gx:0, gy:0, blink:1, smile:12, ear:0, tilt:0};
const M = {
  idle:        {h:90,  cheek:0,   lid:0,   s:12,  ear:0,   tilt:0},
  listen:      {h:108, cheek:0,   lid:0,   s:8,   ear:0.3, tilt:0},
  think:       {h:84,  cheek:0,   lid:.25, s:4,   ear:0,   tilt:-3},
  happy:       {h:80,  cheek:.7,  lid:0,   s:20,  ear:0.15,tilt:0},
  sad:         {h:88,  cheek:0,   lid:.6,  s:-14, ear:-0.2,tilt:2},
  surprised:   {h:118, cheek:0,   lid:0,   s:6,   ear:0.6, tilt:0},
  angry:       {h:78,  cheek:0,   lid:.35, s:-8,  ear:-0.4,tilt:0},
  curious:     {h:100, cheek:.2,  lid:0,   s:10,  ear:0.5, tilt:-4},
  sleepy:      {h:70,  cheek:0,   lid:.75, s:4,   ear:-0.1,tilt:6},
  laugh:       {h:76,  cheek:.85, lid:.15, s:28,  ear:0.25,tilt:0},
  affection:   {h:82,  cheek:.9,  lid:.1,  s:18,  ear:0.1, tilt:3},
  confused:    {h:92,  cheek:0,   lid:.2,  s:2,   ear:0.2, tilt:-8},
  enthusiastic:{h:105, cheek:.6,  lid:0,   s:22,  ear:0.4, tilt:0}
};

let gt={x:0,y:0}, nextGaze=0, nextBlink=1500, blinkT=-1;
const lerp=(a,b,k)=>a+(b-a)*k;

function frame(t){
  const m = M[mood] || M.idle;
  if(robotStage && robotStage.dataset.mood !== mood) robotStage.dataset.mood = mood;
  cur.h     = lerp(cur.h,     m.h,     .15);
  cur.cheek = lerp(cur.cheek, m.cheek, .15);
  cur.lid   = lerp(cur.lid,   m.lid,   .15);
  cur.smile = lerp(cur.smile, m.s,     .15);
  cur.ear   = lerp(cur.ear,   m.ear||0,.12);
  cur.tilt  = lerp(cur.tilt,  m.tilt||0,.1);

  if(t > nextGaze){
    if(mood==='listen' || mood==='surprised' || mood==='curious') gt = {x:0, y:-5};
    else if(mood==='think' || mood==='confused') gt = {x:18, y:-10};
    else if(mood==='sleepy') gt = {x:(Math.random()*2-1)*6, y:4};
    else gt = {x:(Math.random()*2-1)*16, y:(Math.random()*2-1)*8};
    nextGaze = t + 900 + Math.random()*2200;
  }
  cur.gx = lerp(cur.gx, gt.x, .12);
  cur.gy = lerp(cur.gy, gt.y, .12);

  if(blinkT < 0 && t > nextBlink) blinkT = t;
  if(blinkT >= 0){
    const p = (t - blinkT) / 160;
    if(p >= 1){ blinkT = -1; cur.blink = 1; nextBlink = t + 1800 + Math.random()*3500; }
    else cur.blink = 1 - Math.sin(p * Math.PI) * .92;
  }

  const target = speaking ? (.25 + .75 * Math.abs(Math.sin(t/105 + Math.sin(t/230)*2))) : 0;
  cur.o = lerp(cur.o, target, .35);

  draw();
  requestAnimationFrame(frame);
}

function eye(prefix, s, cx, dir){
  const h = Math.max(cur.h * cur.blink, 6);
  const yBase = prefix === 'cat' ? 120 : 105;
  const y = yBase - h/2 + cur.gy;
  const x = cx - 40 + cur.gx;
  const rectId = prefix === 'cat' ? ('catR' + s) : ('r' + s);
  const chId   = prefix === 'cat' ? ('catCh' + s) : ('ch' + s);
  const lidId  = prefix === 'cat' ? ('catLid' + s) : ('lid' + s);

  const e = $(rectId);
  if(e){
    e.setAttribute('x', x);
    e.setAttribute('y', y);
    e.setAttribute('height', h);
  }
  const clip = $(s==='l'?'clr':'crr');
  if(clip){
    clip.setAttribute('x', x);
    clip.setAttribute('y', y);
    clip.setAttribute('height', h);
  }
  const ch = $(chId);
  if(ch){
    ch.setAttribute('cx', cx + cur.gx);
    ch.setAttribute('cy', y + h + 62 - cur.cheek * h * .75);
  }
  const l = cur.lid * h * .9;
  const x0 = x-5, x1 = x+85, yt = y-5;
  const a = dir>0 ? l*1.6 : 0;
  const b = dir>0 ? 0 : l*1.6;
  const lid = $(lidId);
  if(lid) lid.setAttribute('points', `${x0},${yt} ${x1},${yt} ${x1},${yt+b} ${x0},${yt+a}`);
}

function draw(){
  if(mode === 'robot'){
    eye('', 'l', 110, 1);
    eye('', 'r', 290, -1);
    const o = cur.o * 46;
    const y = 228 + cur.gy * .4;
    const cx = 200 + cur.gx * .5;
    const w = 32 + cur.o * 6;
    const s = cur.smile;
    $('mouth').setAttribute('d', `M${cx-w},${y} Q${cx},${y+s} ${cx+w},${y} Q${cx},${y+s+o} ${cx-w},${y} Z`);
  } else {
    eye('cat', 'l', 110, 1);
    eye('cat', 'r', 290, -1);

    const earScale = 1 + cur.ear * 0.12;
    $('catEars').style.transform = `scaleY(${earScale})`;
    $('catEars').style.transformOrigin = '200px 60px';

    // Bocca da gatto pulita
    const o = cur.o * 16;
    const y = 212 + cur.gy * .28;
    const cx = 200 + cur.gx * .28;
    const s = cur.smile * 0.5;
    if(o > 3.5){
      $('catMouth').setAttribute('d', `M${cx-15},${y} Q${cx},${y+s+o} ${cx+15},${y}`);
    }else if(s > 7){
      $('catMouth').setAttribute('d', `M${cx-18},${y} Q${cx},${y+s} ${cx+18},${y}`);
    }else if(s < -4){
      $('catMouth').setAttribute('d', `M${cx-14},${y+2} Q${cx},${y+s} ${cx+14},${y+2}`);
    }else{
      $('catMouth').setAttribute('d', `M${cx-11},${y} Q${cx},${y+3.5} ${cx+11},${y}`);
    }
  }
}
requestAnimationFrame(frame);

function robotGesture(name, duration=1800){
  if(!robotStage) return;
  robotStage.dataset.gesture = name;
  clearTimeout(robotGesture.timer);
  robotGesture.timer = setTimeout(()=>{
    if(robotStage.dataset.gesture === name) robotStage.removeAttribute('data-gesture');
  },duration);
}

function scheduleRobotIdle(){
  clearTimeout(scheduleRobotIdle.timer);
  scheduleRobotIdle.timer = setTimeout(()=>{
    const busy = document.hidden || speaking || listening || storyRunning || currentGame || !commandPanel.hidden;
    if(!busy){
      const actions = ['look','wave','bounce','walk','open'];
      const action = actions[Math.floor(Math.random()*actions.length)];
      robotGesture(action, action==='walk' ? 1900 : 1500);
      if(hasInteracted && Math.random()<0.22){
        const hints = PERSONALITIES[personality].idleHints;
        say(hints[Math.floor(Math.random()*hints.length)], PERSONALITIES[personality].defaultMood);
      }
    }
    scheduleRobotIdle();
  },9000 + Math.random()*8500);
}

let voices = [];
function loadVoices(){voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('it'));}
if('speechSynthesis' in window){loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;}

function say(text, m){
  text = (text || '').trim();
  if(!text) return;
  sayEl.textContent = '“' + text + '”';
  if(!('speechSynthesis' in window)){
    sayEl.textContent = 'Questo browser non legge ad alta voce.';
    mood = 'idle';
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'it-IT';
  if(voices[0]) u.voice = voices[0];
  u.pitch = parseFloat($('pitch').value);
  u.rate = 1.08;
  u.onstart = () => { speaking = true; mood = m || 'happy'; robotStage.classList.add('is-speaking'); };
  u.onboundary = () => { cur.o = 1; };
  const end = () => { speaking = false; mood = 'idle'; robotStage.classList.remove('is-speaking'); };
  u.onend = end;
  u.onerror = end;
  speechSynthesis.speak(u);
}

  confuso:'confused', entusiasmo:'enthusiastic',
  listen:'listen', think:'think'
};
let hist = [];

/* Smista la richiesta al fornitore scelto. Il formato è quello di Gemini,
   che viene convertito al volo per ChatGPT. */
async function callAI(model, key, geminiBody){
  if(currentProvider() === 'openai'){
    const messages = [];
    if(geminiBody.systemInstruction){
      messages.push({role:'system', content: geminiBody.systemInstruction.parts.map(p=>p.text).join('\n')});
    }
    for(const c of (geminiBody.contents||[])){
      messages.push({role: c.role === 'model' ? 'assistant' : 'user', content: (c.parts||[]).map(p=>p.text||'').join('')});
    }
    const r = await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({model, messages, max_tokens: (geminiBody.generationConfig&&geminiBody.generationConfig.maxOutputTokens) || 600})
    });
    if(!r.ok) return {ok:false, status:r.status, json: async()=>({})};
    const j = await r.json();
    const text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    return {ok:true, status:200, json: async()=>({candidates:[{content:{parts:[{text}]}}]})};
  }
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body: JSON.stringify(geminiBody)
  });
}

async function ask(text){
  const key = currentKey();
  if(!key || $('echo').checked){ say(text); return; }

  const low = text.toLowerCase().trim();

  // Comandi buonanotte
  if(checkBedtimeCommand(text)) return;

  // Comandi giochi
  if(checkGameCommand(text)) return;

  // Comandi memoria
  if(checkMemoryCommand(text)) return;

  // Complimenti
  if(checkCompliment(text)){
    const p = PERSONALITIES[personality];
    mood = p.complimentReaction || 'affection';
    playSound(personality==='playful' ? 'happy' : 'purr');
    spawnHearts(3);
    const replies = p.complimentPhrases;
    say(replies[Math.floor(Math.random()*replies.length)], mood);
    return;
  }

  if(/torna\s+robottino|diventa\s+robot|modalit[aà]\s+robot/.test(low)){
    applyMode('robot');
    say('Ok, torno robottino!', 'happy');
    return;
  }
  if(/diventa\s+gatto|modalit[aà]\s+gatto|voglio\s+il\s+gatto/.test(low)){
    applyMode('cat');
    say('Miao! Sono un gattino robot!', 'happy');
    return;
  }
  if(/diventa\s+giocherellone|modalit[aà]\s+giocherellone|si[ie]\s+giocherellone/.test(low)){
    applyPersonality('playful');
    return;
  }
  if(/diventa\s+coccolone|modalit[aà]\s+coccolone|si[ie]\s+coccolone/.test(low)){
    applyPersonality('cuddly');
    return;
  }
  if(/diventa\s+curios[oa]|modalit[aà]\s+curios[oa]|si[ie]\s+curios[oa]/.test(low)){
    applyPersonality('curious');
    return;
  }

  mood = 'think';
  sayEl.textContent = 'Sto pensando…';
  hist.push({role:'user', parts:[{text}]});
  hist = hist.slice(-12);
  try{
    const model = currentModelName();
    const r = await callAI(model, key, {
      systemInstruction:{parts:[{text:buildSys()}]},
      contents:hist,
      generationConfig:{maxOutputTokens:600}
    });
    if(!r.ok){
      hist.pop();
      mood = 'sad';
      const msg = {
        400:'La chiave o il nome del modello non sono validi.',
        403:'Chiave non autorizzata: creane una nuova su AI Studio.',
        404:'Modello non trovato: cambia il nome nelle impostazioni.',
        429:'Troppe richieste, aspetta un minuto e riprova.'
      }[r.status] || ('Errore '+r.status+' da Gemini.');
      sayEl.textContent = msg;
      setTimeout(()=>{ if(!speaking) mood='idle'; }, 2500);
      return;
    }
    const j = await r.json();
    let t = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [])
      .map(p => p.text || '').join('').trim();
    if(!t){
      hist.pop();
      mood = 'idle';
      sayEl.textContent = 'Non ho una risposta, riprova.';
      return;
    }
    hist.push({role:'model', parts:[{text:t}]});
    let m = 'happy';
    const mt = t.match(/^\s*\[(\w+)\]\s*/);
    if(mt){
      m = TAGS[mt[1].toLowerCase()] || 'happy';
      t = t.slice(mt[0].length);
    }
    say(t, m);
    // Proposta spontanea di ricordo se l'utente ha detto qualcosa di personale
    const lastUser = (hist.filter(h=>h.role==='user').slice(-1)[0]||{}).parts?.[0]?.text || '';
    maybeProposeMemory(lastUser, t);
  }catch(_){
    hist.pop();
    mood = 'sad';
    sayEl.textContent = 'Non riesco a collegarmi: controlla la connessione.';
    setTimeout(()=>{ if(!speaking) mood='idle'; }, 2500);
  }
}

/* ---------- FASE 4: Microfono e ascolto ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let listening = false;
let continuousMode = false;
const micStatus = $('micStatus');
const continuousChk = $('continuous');

// Carica preferenza ascolto continuo
continuousChk.checked = store.get('continuous') === '1';
continuousMode = continuousChk.checked;

function updateMicUI(on){
  listening = on;
  talk.setAttribute('aria-pressed', on);
  talk.textContent = on ? 'Ti ascolto…' : 'Parla';
  if(on){
    micStatus.textContent = continuousMode ? '🎙️ Ascolto continuo attivo' : '🎙️ Ti ascolto…';
    micStatus.style.color = 'var(--accent)';
    mood = 'listen';
  }else{
    micStatus.textContent = continuousMode ? 'Ascolto continuo in pausa' : '';
    micStatus.style.color = 'var(--muted)';
    if(!speaking && mood === 'listen') mood = 'idle';
  }
}

function stopListening(){
  if(rec){
    try{ rec.onend = null; rec.stop(); }catch(_){}
    rec = null;
  }
  updateMicUI(false);
}

function startListening(){
  if(!SR){
    sayEl.textContent = 'Il microfono non è disponibile qui: scrivi nel campo sotto.';
    continuousChk.checked = false;
    continuousMode = false;
    return;
  }
  if(listening) return;

  speechSynthesis.cancel();
  speaking = false;

  rec = new SR();
  rec.lang = 'it-IT';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.continuous = false; // usiamo il riavvio manuale per maggiore controllo

  rec.onstart = () => updateMicUI(true);

  rec.onresult = e => {
    const transcript = (e.results[0][0].transcript || '').trim();
    if(transcript){
      // In modalità continua mostriamo cosa ha capito
      if(continuousMode) sayEl.textContent = 'Ho sentito: “' + transcript + '”';
      ask(transcript);
    }
  };

  rec.onerror = e => {
    updateMicUI(false);
    const err = e.error;
    if(err === 'not-allowed' || err === 'service-not-allowed'){
      sayEl.textContent = 'Microfono bloccato: consentilo nelle impostazioni del sito, oppure scrivi nel campo sotto.';
      continuousChk.checked = false;
      continuousMode = false;
      store.set('continuous', '0');
    }else if(err === 'no-speech'){
      if(!continuousMode) sayEl.textContent = 'Non ho sentito nulla, riprova.';
      // in continuo riproviamo silenziosamente
    }else if(err === 'aborted'){
      // ignorato
    }else{
      if(!continuousMode) sayEl.textContent = 'Errore del microfono: ' + err;
    }
  };

  rec.onend = () => {
    updateMicUI(false);
    // Se siamo in ascolto continuo e non stiamo parlando, riavvia
    if(continuousMode && !speaking){
      setTimeout(()=>{
        if(continuousMode && !listening && !speaking){
          try{ startListening(); }catch(_){}
        }
      }, 350);
    }
  };

  try{
    rec.start();
  }catch(err){
    updateMicUI(false);
    sayEl.textContent = 'Non riesco ad avviare il microfono.';
  }
}

// Pulsante Parla (push-to-talk o toggle se continuo)
talk.addEventListener('click', ()=>{
  if(continuousMode){
    // In continuo il pulsante attiva/disattiva l’ascolto
    if(listening){
      stopListening();
      continuousMode = false;
      continuousChk.checked = false;
      store.set('continuous', '0');
      micStatus.textContent = 'Ascolto continuo disattivato';
    }else{
      continuousMode = true;
      continuousChk.checked = true;
      store.set('continuous', '1');
      startListening();
    }
  }else{
    // Push-to-talk classico
    if(listening){
      stopListening();
    }else{
      startListening();
    }
  }
});

// Checkbox ascolto continuo
continuousChk.addEventListener('change', ()=>{
  continuousMode = continuousChk.checked;
  store.set('continuous', continuousMode ? '1' : '0');
  if(continuousMode){
    startListening();
  }else{
    stopListening();
    micStatus.textContent = '';
  }
});

// Quando inizia a parlare, metti in pausa l’ascolto continuo
const originalSay = say;
say = function(text, m){
  if(continuousMode && listening){
    stopListening();
  }
  originalSay(text, m);
  // Dopo che ha finito di parlare, se continuo è attivo, riprendi
  if(continuousMode){
    const checkEnd = setInterval(()=>{
      if(!speaking){
        clearInterval(checkEnd);
        setTimeout(()=>{
          if(continuousMode && !listening) startListening();
        }, 400);
      }
    }, 200);
  }
};

/* ---------- Scuotere il telefono: rabbia buffa ---------- */
const SHAKE_THRESHOLD = 12;      // variazione di accelerazione (m/s²) considerata uno scossone
const SHAKE_HITS_NEEDED = 3;     // scossoni ravvicinati necessari
const SHAKE_WINDOW_MS = 1200;    // finestra entro cui devono avvenire
const SHAKE_REFRACTORY_MS = 180; // un'unica oscillazione conta come un solo scossone

const SHAKE_COOLDOWN_MS = 4000;  // pausa dopo una reazione
let shakeHits = [];
let lastShakeReaction = 0;
let lastAccel = null;

const SHAKE_PHRASES = [
  'Ehi! Non si scuote Robottino, mi viene il mal di testa!',
  'Basta, basta! Sto iniziando a vedere le stelle!',
  'Sono arrabbiatissimo… ma solo un pochino, eh!'
];

function doShake(){
  const now = Date.now();
  if(now - lastShakeReaction < SHAKE_COOLDOWN_MS) return;
  lastShakeReaction = now;
  robotGesture('wave', 1200);
  mood = 'angry';
  playSound('annoy');
  say(SHAKE_PHRASES[Math.floor(Math.random()*SHAKE_PHRASES.length)], 'angry');
  setTimeout(()=>{ if(!speaking && mood==='angry') mood='idle'; }, 2000);
}

function onDeviceMotion(e){
  motionEvents++;
  const a = e.acceleration || e.accelerationIncludingGravity;
  if(!a || a.x == null) return;
  const cur = { x:a.x||0, y:a.y||0, z:a.z||0 };
  if(!lastAccel){ lastAccel = cur; return; }
  const delta = Math.abs(cur.x-lastAccel.x) + Math.abs(cur.y-lastAccel.y) + Math.abs(cur.z-lastAccel.z);
  lastAccel = cur;
  if(delta < SHAKE_THRESHOLD) return;
  const now = Date.now();
  if(now - lastHitTime < SHAKE_REFRACTORY_MS) return;
  lastHitTime = now;
  shakeHits = shakeHits.filter(t => now - t < SHAKE_WINDOW_MS);
  shakeHits.push(now);
  if(shakeHits.length >= SHAKE_HITS_NEEDED){
    shakeHits = [];
    doShake();
  }
}

function enableShake(){
  if(shakeListening || !('DeviceMotionEvent' in window)) return;
  const start = () => {
    window.addEventListener('devicemotion', onDeviceMotion);
    shakeListening = true;
    // Se dopo qualche secondo non arriva nessun dato, lo diciamo chiaramente
    setTimeout(()=>{
      if(motionEvents === 0 && !speaking){
        sayEl.textContent = 'Non ricevo dati dal sensore di movimento. Apri la pagina dal link https e controlla i permessi del browser.';
      }
    }, 4000);
  };
  // iOS 13+ chiede il permesso esplicitamente, e va chiesto da un tocco dell'utente
  if(typeof DeviceMotionEvent.requestPermission === 'function'){
    DeviceMotionEvent.requestPermission().then(r => { if(r === 'granted') start(); else sayEl.textContent = 'Senza il permesso al movimento non posso sentire gli scossoni.'; }).catch(()=>{});
  }else{
    start();
  }
}
// Su Android parte subito; su iPhone serve il primo tocco per chiedere il permesso
if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function'){
  enableShake();
}
document.addEventListener('pointerdown', enableShake);

// Fascia d'età: salvata nel browser e ripristinata all'avvio
$('ageLevel').value = currentAge();
$('ageLevel').addEventListener('change', ()=>{
  store.set('age', $('ageLevel').value);
  sayEl.textContent = $('ageLevel').value ? 'Ok, parlerò in modo adatto ai bambini di ' + $('ageLevel').value + ' anni.' : 'Ok, nessuna fascia di età impostata.';
});

// All’avvio il microfono è sempre spento
updateMicUI(false);

</script>
